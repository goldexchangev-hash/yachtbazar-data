name: Deploy site to GitHub Pages

# Publishes the static frontend (public/) to GitHub Pages so there's a live URL.
# The game contract is deployed from the browser (one button), so no backend
# is required for the core game. (Chat / active-players need the Node server —
# use the Render deploy or run locally for those.)

on:
  push:
    branches: [claude/ethereum-betting-game-vrf-2dq50k, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
