<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reef Raiders v2 — preview</title>
  <style>
    html, body { margin: 0; height: 100%; background: #02060f; overflow: hidden; }
    #stage { position: fixed; inset: 0; }
    #status { position: fixed; left: 8px; top: 8px; font: 12px monospace; color: #9be8ff; z-index: 5; pointer-events: none; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="status">booting…</div>
  <script src="/vendor/playcanvas.min.js"></script>
  <script src="/vendor/gsap.min.js"></script>
  <script src="/fishtable-engine.js"></script>
  <script src="/fishtable3d.js"></script>
  <script>
    (function () {
      var status = function (m) { document.getElementById('status').textContent = m; console.log('[reef3d] ' + m); };
      try {
        var mount = document.getElementById('stage');
        var game = new FishTable3D({ mount: mount, width: window.innerWidth, height: window.innerHeight, initialBalance: 5000 });
        game.start();
        window.__reef3d = game;
        var frames = 0; game.app.on('frameend', function () { frames++; window.__frames = frames; });
        setTimeout(function () { status('Reef Raiders v2 — scene live · ' + (window.__frames || 0) + ' frames'); }, 700);
      } catch (e) {
        status('ERROR: ' + e.message); console.error(e); window.__bootError = e.message;
      }
    })();
  </script>
</body>
</html>
