<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reef 3D — PlayCanvas boot test</title>
  <style>
    html, body { margin: 0; height: 100%; background: #02060f; overflow: hidden; }
    #app { width: 100vw; height: 100vh; display: block; }
    #status { position: fixed; left: 8px; top: 8px; font: 12px monospace; color: #9be8ff; }
  </style>
</head>
<body>
  <canvas id="app"></canvas>
  <div id="status">booting…</div>
  <script src="/vendor/playcanvas.min.js"></script>
  <script>
    (async function () {
      const status = (m) => { document.getElementById('status').textContent = m; console.log('[boot] ' + m); };
      try {
        const canvas = document.getElementById('app');
        let app;

        if (typeof pc.Application === 'function') {
          // Convenience path (registers all systems + handlers)
          app = new pc.Application(canvas, {
            mouse: pc.Mouse ? new pc.Mouse(canvas) : null,
            touch: pc.TouchDevice ? new pc.TouchDevice(canvas) : null,
            graphicsDeviceOptions: { antialias: true, alpha: false },
          });
          status('using pc.Application');
        } else {
          // Engine-only AppBase path
          const device = await pc.createGraphicsDevice(canvas, { antialias: true, alpha: false });
          const opts = new pc.AppOptions();
          opts.graphicsDevice = device;
          opts.componentSystems = [pc.RenderComponentSystem, pc.CameraComponentSystem, pc.LightComponentSystem];
          opts.resourceHandlers = [pc.TextureHandler, pc.ContainerHandler];
          app = new pc.AppBase(canvas);
          app.init(opts);
          status('using pc.AppBase');
        }

        app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);
        app.setCanvasResolution(pc.RESOLUTION_AUTO);
        app.scene.ambientLight = new pc.Color(0.15, 0.25, 0.4);

        // camera
        const cam = new pc.Entity('cam');
        cam.addComponent('camera', { clearColor: new pc.Color(0.02, 0.09, 0.18) });
        cam.setPosition(0, 0, 5);
        app.root.addChild(cam);

        // light
        const light = new pc.Entity('light');
        light.addComponent('light', { type: 'directional', color: new pc.Color(1, 1, 1), intensity: 1.4 });
        light.setEulerAngles(45, 30, 0);
        app.root.addChild(light);

        // a lit, colored spinning box (proves materials + render + light)
        const mat = new pc.StandardMaterial();
        mat.diffuse = new pc.Color(0.25, 0.85, 1.0);
        mat.emissive = new pc.Color(0.05, 0.2, 0.35);
        mat.update();
        const box = new pc.Entity('box');
        box.addComponent('render', { type: 'box', material: mat });
        app.root.addChild(box);

        app.on('update', (dt) => { box.rotate(20 * dt, 30 * dt, 0); });

        app.start();
        // expose for the verifier
        window.__pcApp = app;
        let frames = 0; app.on('frameend', () => { frames++; window.__frames = frames; });
        setTimeout(() => status('rendered ' + (window.__frames || 0) + ' frames OK'), 600);
      } catch (e) {
        status('ERROR: ' + e.message);
        console.error(e);
        window.__bootError = e.message;
      }
    })();
  </script>
</body>
</html>
