<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GEM VAULT 3D — preview</title>
<style>
  html,body{margin:0;background:#05060f;color:#eaf2ff;font-family:system-ui,sans-serif}
  .stage{width:800px;height:600px;max-width:100vw;margin:10px auto;border-radius:12px;overflow:hidden;box-shadow:inset 0 0 0 4px #0e1530}
  .bar{max-width:800px;margin:8px auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  button{font:700 14px/1 system-ui;padding:10px 14px;border-radius:8px;border:none;cursor:pointer;background:#2bdc7e;color:#06231a}
  .msg{min-height:18px;text-align:center;font-weight:700}
  input[type=range]{width:160px}
</style></head>
<body>
  <div class="stage"><div id="mount" style="width:100%;height:100%"></div></div>
  <div class="msg s3d-msg" id="message">Tap SPIN</div>
  <div class="bar">
    <span>Bal <b id="balance">$1,000.00</b></span>
    <span>Win <b id="win">$0.00</b></span>
    <span>Bet <b id="betval">$10.00</b></span>
    <input type="range" id="betslider" min="10" max="500" step="10" value="10">
    <button id="half">½</button><button id="double">2×</button><button id="max">Max</button>
    <button id="spin" data-kind="spin">SPIN</button>
  </div>
  <div class="bar" style="font-size:12px;color:#9aa7c7">
    hash <code id="pfhash">—</code> · nonce <code id="pfnonce">0</code>
    <input id="pfclient" placeholder="client seed"><button id="pfverify">Verify</button>
    <span id="pfreveal"></span><span id="pflast"></span>
  </div>
  <script src="vendor/three.min.js"></script>
  <script src="slots3d-engine.js"></script>
  <script src="slots3d.js"></script>
  <script>
    window.addEventListener("DOMContentLoaded", function () {
      var id = function (x) { return document.getElementById(x); };
      window.GAME = new Slots3D({
        mount: id("mount"), width: 800, height: 600, initialBalance: 1000,
        onBalance: function (b) { /* host would sync demoUsd */ },
        onWin: function (i) { /* host share */ },
        els: {
          balance: id("balance"), win: id("win"), betVal: id("betval"), betSlider: id("betslider"),
          betHalf: id("half"), betDouble: id("double"), betMax: id("max"), spinBtn: id("spin"),
          message: id("message"), pfHash: id("pfhash"), pfNonce: id("pfnonce"), pfClient: id("pfclient"),
          pfVerify: id("pfverify"), pfReveal: id("pfreveal"), pfLast: id("pflast"),
        },
      });
      window.GAME.setActive(true);
    });
  </script>
</body></html>
